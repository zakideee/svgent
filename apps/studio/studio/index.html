<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SVGENT — a client-only studio that stages fictional coding-agent sessions and renders them to SVG, images, and video"
    />
    <!-- The share card is the renderer's own poster output
         (examples/site-og-en.json). og: URLs must be absolute, so these
         name the production origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SVGENT" />
    <meta property="og:title" content="SVGENT — staged agent session studio" />
    <meta
      property="og:description"
      content="SVGENT — a client-only studio that stages fictional coding-agent sessions and renders them to SVG, images, and video"
    />
    <meta property="og:url" content="https://svgent.zakideee.dev/studio/" />
    <meta
      property="og:image"
      content="https://svgent.zakideee.dev/og/site-og-en.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A fictional session with a diff and highlighted code, drawn by svgent from a script"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Language variants are separate static URLs (not Accept-Language
         negotiation); these become absolute once the production origin is
         fixed. -->
    <link rel="alternate" hreflang="en" href="/studio/" vite-ignore />
    <link rel="alternate" hreflang="ja" href="/ja/studio/" vite-ignore />
    <link rel="alternate" hreflang="x-default" href="/studio/" vite-ignore />
    <link rel="icon" type="image/svg+xml" href="/brand/svgent-mark.svg" />
    <title>SVGENT — staged agent session studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
