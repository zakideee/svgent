    <script>
      // The studio remembers the theme its visitor chose and stamps it on its
      // own document as data-ui-theme; this page honours the same choice so
      // crossing between site and studio never flips the colours. Nothing
      // stored leaves the operating system in charge.
      try {
        const uiTheme = window.localStorage.getItem("svgent-ui-theme");
        if (uiTheme === "light" || uiTheme === "dark") {
          document.documentElement.dataset.uiTheme = uiTheme;
        }
      } catch {
        /* Storage unavailable — the operating system decides. */
      }
    </script>
