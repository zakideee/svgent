<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SVGENT — 創作のcoding-agent sessionを演出して、SVG・画像・動画にするclient-only studio"
    />
    <!-- The share card is the renderer's own poster output
         (examples/site-og.json). og: URLs must be absolute, so these name
         the production origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SVGENT" />
    <meta
      property="og:title"
      content="SVGENT — 創作エージェントセッションのスタジオ"
    />
    <meta
      property="og:description"
      content="SVGENT — 創作のcoding-agent sessionを演出して、SVG・画像・動画にするclient-only studio"
    />
    <meta property="og:url" content="https://svgent.zakideee.dev/ja/studio/" />
    <meta
      property="og:image"
      content="https://svgent.zakideee.dev/og/site-og-ja.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="diffとsyntax highlightを含む創作セッション。svgentが台本から描画"
    />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Language variants are separate static URLs (not Accept-Language
         negotiation); these become absolute once the production origin is
         fixed. -->
    <link rel="alternate" hreflang="en" href="/studio/" vite-ignore />
    <link rel="alternate" hreflang="ja" href="/ja/studio/" vite-ignore />
    <link rel="alternate" hreflang="x-default" href="/studio/" vite-ignore />
    <link rel="icon" type="image/svg+xml" href="/brand/svgent-mark.svg" />
    <title>SVGENT — 創作エージェントセッションのスタジオ</title>
    <script>
      // Arriving under /ja/ seeds the UI language once; a language the visitor
      // has already chosen in the studio always wins.
      try {
        if (window.localStorage.getItem("svgent-lang") === null) {
          window.localStorage.setItem("svgent-lang", "ja");
        }
      } catch {
        /* Storage unavailable — the studio falls back to navigator.language. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
